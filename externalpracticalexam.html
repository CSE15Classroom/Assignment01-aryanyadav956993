<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Course Page</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #f4f4f4;
}

/* Header */
header{
    background-color: #2c3e50;
    color: white;
    padding: 20px;
    text-align: center;
}

/* Container */
.container{
    width: 80%;
    margin: auto;
    padding: 20px;
}

/* Video Section */
.video{
    text-align: center;
    margin-bottom: 30px;
}

/* Modules Section */
.modules{
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

.modules h2{
    color: #2c3e50;
}

/* List Styling */
.modules ul{
    list-style-type: square;
    padding-left: 20px;
}

.modules li{
    padding: 8px;
    font-size: 18px;
}

/* Footer */
footer{
    text-align: center;
    background: #2c3e50;
    color: white;
    padding: 10px;
    margin-top: 20px;
}
</style>
</head>

<body>

<header>
    <h1>Web Development Course</h1>
    <p>Learn HTML, CSS and JavaScript</p>
</header>

<div class="container">

    <!-- YouTube Video -->
    <div class="video">
        <h2>Course Tutorial</h2>
        <iframe width="560" height="315"
            src="https://www.youtube.com/embed/qz0aGYrrlhU"
            frameborder="0" allowfullscreen>
        </iframe>
    </div>

    <!-- Course Modules -->
    <div class="modules">
        <h2>Course Modules</h2>
        <ul>
            <li>Introduction to Web Development</li>
            <li>HTML Basics and Structure</li>
            <li>CSS Styling and Layout</li>
            <li>Responsive Design</li>
            <li>JavaScript Fundamentals</li>
            <li>Final Project</li>
        </ul>
    </div>

</div>

<footer>
    <p>© 2026 Online Course Platform</p>
</footer>

</body>
</html>
